[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "durapy"
version = "1.0.0.3"
description = "A modern Python utility library from the Durendal ecosystem."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LICENSE" }

authors = [
    { name = "Simon Stordal Amundgård" }
]

keywords = [
    "engineering",
    "utilities",
    "python",
    "math",
    "cli",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

dependencies = [
    "questionary",
    "prompt_toolkit",
    "numpy",
    "sympy",
    "scipy",
    "rich"
]

[project.urls]
Homepage = "https://github.com/amundgaard09/durendal"
Repository = "https://github.com/amundgaard09/durendal"
Issues = "https://github.com/amundgaard09/durendal/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["durapy*"]
